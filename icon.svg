<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 180" width="100%" height="100%">
  <!-- ================= LOGO 1: PT PERMATA HUSADA SAKTI ================= -->
  <g id="logo-phs" transform="translate(15, 10)">
    <!-- Balok Navy Huruf L Tegak -->
    <path d="M 10 20 L 60 20 L 60 90 L 120 90 L 120 150 L 10 150 Z" fill="#1b1c5c"/>
    
    <!-- Roda Cakra Biru Medis -->
    <circle cx="108" cy="48" r="44" fill="none" stroke="#005bac" stroke-width="5"/>
    <!-- Pusat Bulat Merah -->
    <circle cx="108" cy="48" r="13" fill="#dc2626"/>
    
    <!-- 8 Jari-Jari Roda Cakra -->
    <line x1="108" y1="4" x2="108" y2="92" stroke="#005bac" stroke-width="4.5"/>
    <line x1="64" y1="48" x2="152" y2="48" stroke="#005bac" stroke-width="4.5"/>
    <line x1="77" y1="17" x2="139" y2="79" stroke="#005bac" stroke-width="4.5"/>
    <line x1="77" y1="79" x2="139" y2="17" stroke="#005bac" stroke-width="4.5"/>

    <!-- Teks: PERMATA HUSADA SAKTI -->
    <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" fill="#1b1c5c" font-size="38" letter-spacing="1.5">
      <text x="175" y="52">PERMATA</text>
      <text x="175" y="96">HUSADA</text>
      <text x="175" y="140">SAKTI</text>
    </g>
  </g>

  <!-- GARIS PEMBATAS VERTIKAL HALUS -->
  <line x1="495" y1="20" x2="495" y2="160" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4"/>

  <!-- ================= LOGO 2: RUMAH SAKIT GRHA PERMATA IBU ================= -->
  <g id="logo-rpi" transform="translate(515, 12)">
    <!-- Bulan Sabit Hijau Toska -->
    <circle cx="70" cy="78" r="62" fill="none" stroke="#007a3d" stroke-width="11"/>
    
    <!-- Siluet Ibu Menggendong Bayi -->
    <path d="M 56 42 C 68 42 78 50 78 60 C 78 71 70 76 60 79 C 52 81 46 90 46 103 L 84 103 C 88 103 91 98 91 92 C 91 73 77 56 56 42 Z" fill="#007a3d"/>
    <circle cx="63" cy="55" r="7" fill="#ffffff"/>
    <path d="M 48 85 C 56 85 63 90 63 97 L 41 97 C 41 90 44 85 48 85 Z" fill="#007a3d"/>

    <!-- Teks: Rumah Sakit Grha PERMATA IBU -->
    <text x="145" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="24" fill="#1e293b" letter-spacing="0.5">Rumah Sakit</text>
    <text x="145" y="112" font-family="'Plus Jakarta Sans', Georgia, serif" font-weight="900" font-style="italic" font-size="36" fill="#007a3d" letter-spacing="0.5">Grha PERMATA IBU</text>
  </g>
</svg>
